<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="https://bluvarri.com/favicon.png">

  <title>助力部落</title>

  <script src="/common/javascripts/avif-webp.min.js"></script>


  <link rel="stylesheet" href="/common/stylesheets/style.scss">
  <link rel="stylesheet" href="/rainbow/oasis/stylesheets/kindness.scss">

</head>

<body>
  <div id="app" class="app-container" v-cloak>

    <div v-if="!init_finish">
      <img class="loading-annimation" src="/common/images/loading.gif" alt="loading annimation">
    </div>

    <div v-else="init_finish" class="sponsor-card" id="sponsorCard">

      <div id="mainView">

        <div class="profile-identity">
          <div class="avatar-row">
            <div class="avatar-wrapper">
              <a  :href="'/'+announce.handle">
                <img class="avatar-img"
                :src="adaptiveImageUriV(announce.avatar) || oasisAvatarDefault" @error="e => { e.target.src = oasisAvatarDefault }"
                alt="社群头像" />
              </a>
            </div>
            <a href="/estudio/studio-shop" class="text-decoration-none">
              <div class="verified-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-store-icon lucide-store"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></svg>
                商城充值
              </div>
            </a>
          </div>
  
          <div class="profile-name">{{announce.title}}</div>
          <p class="profile-meta">
            {{explainOasisMarkEnumV(announce.mark)}}<span class="sep">·</span>{{Number(announce.membership).toLocaleString('en-US')}} 位成员
          </p>
          <p class="profile-desc">
            {{announce.subTitle}}
          </p>
        </div>
  
        <div class="section-divider"></div>
  
        <div class="form-section">
          <div class="section-label">
            为部落注入算力
            <div class="tip-wrapper">
              <button class="tip-trigger" aria-label="说明">
                <i class="bi bi-question-circle" style="font-size:13px;"></i>
              </button>
              <div class="tip-bubble">每份算力 ¥5，助力社群持续运营</div>
            </div>
          </div>
  
          <div class="qty-container">
            <div class="qty-icon">
              <svg viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2"/>
                <rect x="9" y="9" width="6" height="6"/>
                <path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>
              </svg>
            </div>
            <span class="qty-times">×</span>
            <div class="qty-pills" role="group" aria-label="选择算力数量">
              <button class="qty-pill" :class="{'active': cnt==1}" @click="changeCntV(1)" >1</button>
              <button class="qty-pill" :class="{'active': cnt==3}" @click="changeCntV(3)">3</button>
              <button class="qty-pill" :class="{'active': cnt==5}" @click="changeCntV(5)">5</button>
              <input  @input="transformInputNumberAsPositiveV($event)"  v-model="cnt" type="text" min="1" max="9999" type="text"  class="qty-pill-input">
            </div>
          </div>
  
          <div class="price-row">
            <span class="price-label" id="priceLabel">{{cnt}} 份 × ¥5</span>
            <span class="price-amount" id="priceAmount">¥{{totalAmount}}</span>
          </div>
  
          <button  type="button"  @click="showSponsorFocusModalV"   :disabled="isSubmitting || !cnt || announce.mark!='2'" class="btn-sponsor" id="btnSponsor">
            <span id="btnLabel">赞助 ¥{{totalAmount}}</span>
          </button>
          <p class="footnote">特别提示：助力金额将转化为同等数额的贡献值</p>
        </div>
      </div>
  
    </div>

    <section class="modals">
      <!-- focus modal start -->
      <div class="modal-container">
        <div class="modal fade" id="focusModal" data-bs-backdrop="static" tabindex="-1">
          <div class="modal-dialog  modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
              <!--begin::Alert-->
            <div class="d-flex text-center flex-column alert-info mb-2">


              <!--begin::Icon-->
              <i class="bi bi-exclamation-circle mb-2"></span><span class="path2"></span><span class="path3"></span></i>
              <!--end::Icon-->

              <!--begin::Wrapper-->
              <div class="text-center">
                  <!--begin::Title-->
                  <span class="fw-bold mb-2 modal-head">操作提示</span>
                  <!--end::Title-->

                  <!--begin::Separator-->
                  <div class="separator separator-dashed border-dark opacity-25 mb-2"></div>
                  <!--end::Separator-->

                  <!--begin::Content-->
                  <div class="font12" style="word-break: break-all; padding-left: .5rem; padding-right: .5rem;">
                      <span class="me-2">您的账户即将被扣除:</span>
                      <span  style="font-weight: 600;">{{focusModal.feed}}</span>
                      
                  </div>
      
                  <!--end::Content-->

                  <!--begin::Buttons-->
                  <div class="d-flex justify-content-center flex-wrap pt-3">
                      <a  v-preventreclick @click="closeSponsorFocusModalV" class="btn btn-cancel m-3">取消</a>
                      <a type="button" :disabled="isSubmitting || !cnt || announce.mark!='2'" v-preventreclick @click="focusModal.confirmHandler" class="btn btn-confirm m-3">继续</a>
                  </div>
                  <!--end::Buttons-->
              </div>
              <!--end::Wrapper-->
            </div>
            <!--end::Alert-->
            </div>
          </div>
        </div>
      </div>
      <!-- focus modal end -->

    </section>

  </div>

  <script type="module" src="/common/javascripts/tm.js"></script>
  <script type="module" src="/rainbow/oasis/javascripts/kindness.js"></script>

</body>
</html>
