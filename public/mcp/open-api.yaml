info:
    description: "插件主要功能 \n业务全景检索 (Universal Retrieval)：瞬时调取班蔚平台产品目录、详情及动态指标，实现数据层面的全量观测。\n资产脉络追踪 (Asset Tracking)：实时获取用户的历史订单、交易存证。\n指令权限代理 (Authority Delegation)：通过 OAuth 2.0 协议获得用户授权后，全权代理身份行使业务决策。"
    title: 班蔚·端脑·开放
    version: v1
openapi: 3.1.2
servers:
    - url: https://bluvarri.com


paths:
    /api/v1/ms/private/{friend}/event/storeText:
        put:
            operationId: send_text_msg_to_friend
            parameters:
                - description: 好友UID
                  in: path
                  name: friend
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                msg:
                                    description: 消息内容，长度不超过500
                                    type: string
                                msgType:
                                    default: text
                                    description: 消息类型：文本消息统一输入枚举： text
                                    type: string
                            required:
                                - msgType
                                - msg
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
                                        type: number
                                    message:
                                        description: 状态说明：成功为 Success
                                        type: string
                                type: object
                    description: new desc
                default:
                    description: ""
            summary: 给私信好友发文字类型的消息
    /api/v1/ms/private/me/event/friend/list:
        get:
            operationId: find_friends
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
                                        type: number
                                    friend:
                                        description: 好友列表
                                        properties:
                                            records:
                                                items:
                                                    properties:
                                                        avatar:
                                                            description: 头像
                                                            type: [string, "null"]
                                                        brandMark:
                                                            description: 状态，枚举值：2-已销户；3-在线；4-离线；
                                                            type: [string, "null"]
                                                        id:
                                                            description: 用户 uid
                                                            type: [string, "null"]
                                                        latestContent:
                                                            description: 最新消息
                                                            type: [string, "null"]
                                                        modifiedAt:
                                                            description: 最新消息发送时间
                                                            type: [string, "null"]
                                                        title:
                                                            description: 昵称
                                                            type: [string, "null"]
                                                        unread:
                                                            description: 未读消息数量
                                                            type: [string, "null"]
                                                    type: object
                                                    additionalProperties: true
                                                type: array
                                        type: object
                                    message:
                                        description: 状态说明：成功为 Success
                                        type: string
                                type: object
                    description: new desc
                default:
                    description: ""
            summary: 查询私信好友列表信息
    /api/v1/team/trans:
        get:
            operationId: search_trans
            parameters:
                - description: 每页返回的服务数量
                  in: query
                  name: size
                  required: true
                  schema:
                    default: 10
                    type: integer
                - description: 当前分页页码
                  in: query
                  name: current
                  required: true
                  schema:
                    default: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
                                        type: number
                                    message:
                                        description: 状态说明：成功为 Success
                                        type: string
                                    trans:
                                        description: 历史交易记录
                                        properties:
                                            current:
                                                description: 当前分页页码
                                                type: number
                                            pages:
                                                description: 数据总共有多少页
                                                type: number
                                            records:
                                                items:
                                                    properties:
                                                        amount:
                                                            description: 交易金额（元）
                                                            type: [string, "null"]
                                                        createAt:
                                                            description: 交易日期
                                                            type: [string, "null"]
                                                        direction:
                                                            description: 收支标识，-1 表示支出，1 表示收款
                                                            type: [string, "null"]
                                                        transNumber:
                                                            description: 流水编号
                                                            type: [string, "null"]
                                                        transType:
                                                            description: 场景枚举
                                                            type: [string, "null"]
                                                        transTypeDesc:
                                                            description: 是 transType 的枚举解释，比如部落赞助、订阅账单支付等等
                                                            type: [string, "null"]
                                                    type: object
                                                    additionalProperties: true
                                                type: array
                                            size:
                                                description: 每页返回的记录数量
                                                type: number
                                            total:
                                                description: 总共有多少记录
                                                type: number
                                        type: object
                                type: object
                    description: new desc
                default:
                    description: ""
            summary: 查询当前用户的流水、交易记录
    /api/v1/web/affiliate/product:
        get:
            operationId: search_kol_products
            parameters:
                - description: 搜索关键词，用于匹配特定技能名称、商家或标签的商品。示例：'插画定制'、'小米'、'GEO'。
                  in: query
                  name: q
                  schema:
                    type: string
                - description: 最小经营年限，单位为月。示例：30 - 表示30个月，也就是2年半
                  in: query
                  name: supplierAccountAgeLeft
                  schema:
                    type: string
                - description: 最近活跃 。枚举值：1 为 一周内活跃； 2 为 一月内活跃；3 为三个月内活跃；
                  in: query
                  name: heartbeat
                  schema:
                    type: string
                - description: 会员标识。只能输入 1 或者 空，1 表示开通会员的供应商。
                  in: query
                  name: blue
                  schema:
                    type: string
                - description: 单品最低价格
                  in: query
                  name: planPriceLeft
                  schema:
                    type: string
                - description: 供应商是否提供发票。只能输入 1 或者 空，
                  in: query
                  name: provideInvoice
                  schema:
                    type: string
                - description: 商品最低佣金比例
                  in: query
                  name: revshareLeft
                  schema:
                    type: string
                - description: 商品最低浏览量，单位为1000，示例：3 表示最低浏览量为3000人次
                  in: query
                  name: viewsLeft
                  schema:
                    type: string
                - description: 商品最高浏览量，单位为1000，示例：6 表示最高浏览量为6000人次
                  in: query
                  name: viewsRight
                  schema:
                    type: string
                - description: 单品最高价格
                  in: query
                  name: planPriceRight
                  schema:
                    type: string
                - description: 商品最高佣金比例
                  in: query
                  name: revshareRight
                  schema:
                    type: string
                - description: 最大经营年限，配合最小经营年限进行区间查询。单位为月。示例：30 - 表示30个月，也就是2年半
                  in: query
                  name: supplierAccountAgeRight
                  schema:
                    type: string
                - description: 最低销量
                  in: query
                  name: saleVolumeLeft
                  schema:
                    type: string
                - description: 最大销量
                  in: query
                  name: saleVolumeRight
                  schema:
                    type: string
                - description: 带货达人数量（最低）
                  in: query
                  name: influencersLeft
                  schema:
                    type: string
                - description: 带货达人数量（最高）
                  in: query
                  name: influencersRight
                  schema:
                    type: string
                - description: 每页返回的服务数量
                  in: query
                  name: size
                  required: true
                  schema:
                    default: 10
                    type: integer
                - description: 当前分页页码
                  in: query
                  name: current
                  required: true
                  schema:
                    default: 1
                    type: integer
                - description: 排序，枚举值。1-单品价格；2-佣金比例；3-单品销量；4-销售额；5-浏览量；6-带货达人数量；
                  in: query
                  name: sort
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
                                        type: number
                                    message:
                                        description: 状态说明：成功为 Success
                                        type: string
                                    product:
                                        description: 选品数据列表
                                        properties:
                                            current:
                                                description: 当前分页页码
                                                type: number
                                            pages:
                                                description: 数据总共有多少页
                                                type: number
                                            records:
                                                items:
                                                    properties:
                                                        cellId:
                                                            description: 商品Id
                                                            type: [string, "null"]
                                                        cellSaleVolume:
                                                            description: 特约销量
                                                            type: [string, "null"]
                                                        inChoice:
                                                            description: 是否已经添加到带货橱窗。示例：1 表示已经添加
                                                            type: [string, "null"]
                                                        influencers:
                                                            description: 带货达人数量
                                                            type: [string, "null"]
                                                        planPrice:
                                                            description: 单品单价
                                                            type: [string, "null"]
                                                        planSaleVolume:
                                                            description: 单品销量
                                                            type: [string, "null"]
                                                        productName:
                                                            description: 商品名
                                                            type: [string, "null"]
                                                        refundOrders:
                                                            description: 已退款的订单数量
                                                            type: [string, "null"]
                                                        revshare:
                                                            description: 佣金比例
                                                            type: [string, "null"]
                                                        sales:
                                                            description: 销售额
                                                            type: [string, "null"]
                                                        supplierBrandId:
                                                            description: 商品供应商品牌Id
                                                            type: [string, "null"]
                                                        views:
                                                            description: 浏览量
                                                            type: [string, "null"]
                                                    type: object
                                                    additionalProperties: true
                                                type: array
                                            size:
                                                description: 每页返回的记录数量
                                                type: number
                                            total:
                                                description: 总共有多少记录
                                                type: number
                                        type: object
                                type: object
                    description: new desc
                default:
                    description: ""
            summary: 查询选品信息，创作者、明星、流量达人等KOL可通过本工具选择需要带货的商品。
    /api/v1/web_mall/brand/{brand_id}/profile:
        get:
            operationId: find_one_brand_info
            parameters:
                - description: 品牌Id
                  in: path
                  name: brand_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
                                        type: number
                                    message:
                                        description: 请求成功或失败时的简单解释
                                        type: string
                                    profile:
                                        properties:
                                            deliveryArea:
                                                description: 配送范围：空表示系统的的默认配置同城配送
                                                type: [string, "null"]
                                            minDeliveryAmount:
                                                description: 起送价：空表示使用系统的默认配置 20 元
                                                type: [string, "null"]
                                            availableForWork:
                                                description: 求职标识：1-求职中
                                                type: [string, "null"]
                                            avator:
                                                description: 品牌头像Url
                                                type: [string, "null"]
                                            brand:
                                                description: 品牌名
                                                type: [string, "null"]
                                            brandMark:
                                                description: 商家的状态，2-已注销；3-在线；4-离线
                                                type: [string, "null"]
                                            brandTypeCode:
                                                description: 账号类型，1-结构，其他为个人
                                                type: [string, "null"]
                                            brandUserId:
                                                description: 品牌的用户Id
                                                type: [string, "null"]
                                            businessScope:
                                                description: 经营范围
                                                type: [string, "null"]
                                            cooperationScope:
                                                description: 自由合作范围与内容
                                                type: [string, "null"]
                                            cover:
                                                description: 品牌横幅图片URL
                                                type: [string, "null"]
                                            createAt:
                                                description: 品牌注册日期
                                                type: [string, "null"]
                                            enableBlue:
                                                description: 会员标识：1-开启 0-关闭
                                                type: [string, "null"]
                                            enableFoodForWork:
                                                description: 以工换食，1-开启；雇员给品牌工作，作为回报，品牌需要为雇员准备食物或用餐费，建议餐标每人每日不低于 30 RMB，本标识用于义工或慈善场景，默认为关闭状态
                                                type: [string, "null"]
                                            enableMentorship:
                                                description: 是否收徒：1-开启 0-关闭
                                                type: [string, "null"]
                                            experience:
                                                description: 工作经历或组织历史沿革
                                                items:
                                                    properties:
                                                        end:
                                                            description: 经历结束时间
                                                            type: [string, "null"]
                                                        entries:
                                                            description: 经历细化描述
                                                            type: [string, "null"]
                                                        icon:
                                                            description: 图标
                                                            type: [string, "null"]
                                                        start:
                                                            description: 经历开始时间
                                                            type: [string, "null"]
                                                        subTitle:
                                                            description: 简短说明
                                                            type: [string, "null"]
                                                        title:
                                                            description: 经历
                                                            type: [string, "null"]
                                                    type: object
                                                type: [array, "null"]
                                            freeNightCounsellor:
                                                description: 夜间咨询：1-开启 0-关闭；处于开启状态，表示在每天夜晚(18:00 ～ 22:00)，品牌为有需要的用户提供无偿、免费的咨询服务。
                                                type: [string, "null"]
                                            handle:
                                                description: 品牌标识，可通过 https://bluvarrri.com/品牌标识，访问品牌主页
                                                type: [string, "null"]
                                            hiring:
                                                description: 招聘标识：1-招聘中
                                                type: [string, "null"]
                                            industry:
                                                description: 行业
                                                type: [string, "null"]
                                            industryCode:
                                                description: 行业编码
                                                type: [string, "null"]
                                            links:
                                                description: 品牌的社交媒体、官网等连接
                                                type: [string, "null"]
                                            location:
                                                description: IP 归属地
                                                type: [string, "null"]
                                            mentorHonor:
                                                description: 品牌作为导师指导学员获取的荣誉标识
                                                type: [string, "null"]
                                            occupation:
                                                description: 职业
                                                type: [string, "null"]
                                            occupationCode:
                                                description: 职业编码
                                                type: [string, "null"]
                                            pdOasisId:
                                                description: 私域部落Id，用于私域运营的部落Id
                                                type: [string, "null"]
                                            skills:
                                                description: 品牌词条，比如UI UX，Spring Boot
                                                items:
                                                    properties:
                                                        entry:
                                                            type: [string, "null"]
                                                    type: object
                                                type: [array, "null"]
                                            supportFreeCooperation:
                                                description: 是否支持自由合作：1-支持 0-不支持；自由合作用来标记品牌的对外合作意向，默认为关闭，表示不支持各种合作方式；处于开放状态，表示品牌愿意与其他感兴趣的第三方讨论各种合作方式；
                                                type: [string, "null"]
                                            title:
                                                description: 品牌简介
                                                type: [string, "null"]
                                            typeOfBusiness:
                                                description: 商业主体，0-非商业主体，1-独资经营，2-合伙经营，3-有限责任公司，4-C型股份制有限公司，5-S型股份制有限公司，6-B型股份制有限公司，7-非营利机构，8-个体户，9-合作社，10-社团，11-协会，12-党派
                                                type: [string, "null"]
                                        type: [object, "null"]
                                        additionalProperties: true
                                type: [object, "null"]
                    description: new desc
                default:
                    description: ""
            summary: 查询商家信息
    /api/v1/web_mall/brand/virtual/product:
        get:
            operationId: find_virtual_products_by_brand
            parameters:
                - description: 品牌（商家）Id
                  in: query
                  name: brandId
                  required: true
                  schema:
                    type: string
                - description: 搜索关键词，用于匹配虚拟商品名称。示例：'爱奇艺会员'、' 苹果美区账户充值'、'2026世界经济报告'。
                  in: query
                  name: q
                  schema:
                    type: string
                - description: 商品状态：2-热卖中，3-已下架，1-草稿箱
                  in: query
                  name: status
                  required: true
                  schema:
                    default: "2"
                    type: string
                - description: 当前分页页码
                  in: query
                  name: current
                  required: true
                  schema:
                    default: 1
                    type: integer
                - description: 每页返回的服务数量
                  in: query
                  name: size
                  required: true
                  schema:
                    default: 5
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        type: number
                                    message:
                                        type: string
                                    product:
                                        properties:
                                            current:
                                                type: number
                                            pages:
                                                type: number
                                            records:
                                                items:
                                                    properties:
                                                        clicks:
                                                            description: 商品点击量
                                                            type: [string, "null"]
                                                        createAt:
                                                            description: 商品上架时间
                                                            type: [string, "null"]
                                                        inventory:
                                                            description: 商品库存
                                                            type: [string, "null"]
                                                        productId:
                                                            description: 商品Id
                                                            type: [string, "null"]
                                                        productName:
                                                            description: 商品名称
                                                            type: [string, "null"]
                                                        productPrice:
                                                            description: 商品价格
                                                            type: [string, "null"]
                                                        salesVolume:
                                                            description: 商品销量
                                                            type: [string, "null"]
                                                        sellerAvatar:
                                                            description: 商家头像
                                                            type: [string, "null"]
                                                        sellerBrandId:
                                                            description: 商家Id
                                                            type: [string, "null"]
                                                        sellerName:
                                                            description: 商家名称
                                                            type: [string, "null"]
                                                        thumbnailUrl:
                                                            description: 商品主图
                                                            type: [string, "null"]
                                                        views:
                                                            description: 商品曝光量
                                                            type: [string, "null"]
                                                    type: object
                                                    additionalProperties: true
                                                type: array
                                            size:
                                                type: number
                                            total:
                                                type: number
                                        type: object
                                type: object
                    description: new desc
                default:
                    description: ""
            summary: 查询指定商家名下的虚拟商品列表。仅返回数字类商品（如会员、点卡、代金券），不包含实物。
    /api/v1/web_mall/brandCells:
        get:
            operationId: find_gigs_by_brand
            parameters:
                - description: 品牌（商家）Id
                  in: query
                  name: brandId
                  required: true
                  schema:
                    type: string
                - description: 搜索关键词，用于匹配技能名称或商家。示例：'插画定制'、'法律咨询'、'后期剪辑'。
                  in: query
                  name: q
                  schema:
                    type: string
                - description: 当前分页页码
                  in: query
                  name: current
                  required: true
                  schema:
                    default: 1
                    type: integer
                - description: 每页返回的服务数量
                  in: query
                  name: size
                  required: true
                  schema:
                    default: 5
                    type: integer
                - description: 标准计费单位 (Standard Billing Unit)。例如：'second' (按秒计费), 'minute' (按分钟计费), 'hour' (按时计费), 'day' (按天计费), 'week' (按周计费), 'month' (按月计费), 'quarter' (按季度计费), 'year' (按年计费)。
                  in: query
                  name: sbu
                  required: true
                  schema:
                    default: hour
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    cells:
                                        properties:
                                            current:
                                                type: number
                                            pages:
                                                type: number
                                            records:
                                                items:
                                                    properties:
                                                        avator:
                                                            description: 品牌（商家）头像
                                                            type: [string, "null"]
                                                        brand:
                                                            description: 品牌（商家）名称
                                                            type: [string, "null"]
                                                        brandId:
                                                            description: 品牌（商家）Id
                                                            type: [string, "null"]
                                                        brandMark:
                                                            description: 品牌（商家）的状态，2-已注销；3-在线；4-离线
                                                            type: [string, "null"]
                                                        enableBlue:
                                                            description: 品牌（商家）是否开通会员
                                                            type: [string, "null"]
                                                        id:
                                                            description: 技能服务Id
                                                            type: [string, "null"]
                                                        preview:
                                                            description: 技能服务主图
                                                            type: [string, "null"]
                                                        price:
                                                            description: 价格
                                                            type: number
                                                        sbu:
                                                            description: 标准计费单位 (Standard Billing Unit)。例如：'second' (按秒计费), 'minute' (按分钟计费), 'hour' (按时计费), 'day' (按天计费), 'week' (按周计费), 'month' (按月计费), 'quarter' (按季度计费), 'year' (按年计费)。
                                                            type: [string, "null"]
                                                        title:
                                                            description: 技能服务名称
                                                            type: [string, "null"]
                                                    type: object
                                                    additionalProperties: true
                                                type: array
                                            size:
                                                type: number
