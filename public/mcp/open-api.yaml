info:
    description: "插件主要功能 \n业务全景检索 (Universal Retrieval)：瞬时调取班蔚平台产品目录、详情及动态指标，实现数据层面的全量观测。\n资产脉络追踪 (Asset Tracking)：实时获取用户的历史订单、交易存证。\n指令权限代理 (Authority Delegation)：通过 OAuth 2.0 协议获得用户授权后，全权代理身份行使业务决策。"
    title: 班蔚·端脑·开放
    version: v1
openapi: 3.0.1
paths:
    /api/v1/ms/private/{friend}/event/storeText:
        put:
            operationId: send_text_msg_to_friend
            parameters:
                - description: 好友UID
                  in: path
                  name: friend
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                msg:
                                    description: 消息内容，长度不超过500
                                    type: string
                                msgType:
                                    default: text
                                    description: 消息类型：文本消息统一输入枚举： text
                                    type: string
                            required:
                                - msgType
                                - msg
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
                                        type: number
                                    message:
                                        description: 状态说明：成功为 Success
                                        type: string
                                type: object
                    description: new desc
                default:
                    description: ""
            summary: 给私信好友发文字类型的消息
    /api/v1/ms/private/me/event/friend/list:
        get:
            operationId: find_friends
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
                                        type: number
                                    friend:
                                        description: 好友列表
                                        properties:
                                            records:
                                                items:
                                                    properties:
                                                        avatar:
                                                            description: 头像
                                                            type: [string, "null"]
                                                        brandMark:
                                                            description: 状态，枚举值：2-已销户；3-在线；4-离线；
                                                            type: [string, "null"]
                                                        id:
                                                            description: 用户 uid
                                                            type: [string, "null"]
                                                        latestContent:
                                                            description: 最新消息
                                                            type: [string, "null"]
                                                        modifiedAt:
                                                            description: 最新消息发送时间
                                                            type: [string, "null"]
                                                        title:
                                                            description: 昵称
                                                            type: [string, "null"]
                                                        unread:
                                                            description: 未读消息数量
                                                            type: [string, "null"]
                                                    type: object
                                                    additionalProperties: true
                                                type: array
                                        type: object
                                    message:
                                        description: 状态说明：成功为 Success
                                        type: string
                                type: object
                    description: new desc
                default:
                    description: ""
            summary: 查询私信好友列表信息
    /api/v1/team/trans:
        get:
            operationId: search_trans
            parameters:
                - description: 每页返回的服务数量
                  in: query
                  name: size
                  required: true
                  schema:
                    default: 10
                    type: integer
                - description: 当前分页页码
                  in: query
                  name: current
                  required: true
                  schema:
                    default: 1
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                description: new desc
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
                                        type: number
                                    message:
                                        description: 状态说明：成功为 Success
                                        type: string
                                    trans:
                                        description: 历史交易记录
                                        properties:
                                            current:
                                                description: 当前分页页码
                                                type: number
                                            pages:
                                                description: 数据总共有多少页
                                                type: number
                                            records:
                                                items:
                                                    properties:
                                                        amount:
                                                            description: 交易金额（元）
                                                            type: [string, "null"]
                                                        createAt:
                                                            description: 交易日期
                                                            type: [string, "null"]
                                                        direction:
                                                            description: 收支标识，-1 表示支出，1 表示收款
                                                            type: [string, "null"]
                                                        transNumber:
                                                            description: 流水编号
                                                            type: [string, "null"]
                                                        transType:
                                                            description: 场景枚举
                                                            type: [string, "null"]
                                                        transTypeDesc:
                                                            description: 是 transType 的枚举解释，比如部落赞助、订阅账单支付等等
                                                            type: [string, "null"]
                                                    type: object
                                                    additionalProperties: true
                                                type: array
                                            size:
                                                description: 每页返回的记录数量
                                                type: number
                                            total:
                                                description: 总共有多少记录
                                                type: number
                                        type: object
                                type: object
                    description: new desc
                default:
                    description: ""
            summary: 查询当前用户的流水、交易记录
    /api/v1/web/affiliate/product:
        get:
            operationId: search_kol_products
            parameters:
                - description: 搜索关键词，用于匹配特定技能名称、商家或标签的商品。示例：'插画定制'、'小米'、'GEO'。
                  in: query
                  name: q
                  schema:
                    type: string
                - description: 最小经营年限，单位为月。示例：30 - 表示30个月，也就是2年半
                  in: query
                  name: supplierAccountAgeLeft
                  schema:
                    type: string
                - description: 最近活跃 。枚举值：1 为 一周内活跃； 2 为 一月内活跃；3 为三个月内活跃；
                  in: query
                  name: heartbeat
                  schema:
                    type: string
                - description: 会员标识。只能输入 1 或者 空，1 表示开通会员的供应商。
                  in: query
                  name: blue
                  schema:
                    type: string
                - description: 单品最低价格
                  in: query
                  name: planPriceLeft
                  schema:
                    type: string
                - description: 供应商是否提供发票。只能输入 1 或者 空，
                  in: query
                  name: provideInvoice
                  schema:
                    type: string
                - description: 商品最低佣金比例
                  in: query
                  name: revshareLeft
                  schema:
                    type: string
                - description: 商品最低浏览量，单位为1000，示例：3 表示最低浏览量为3000人次
                  in: query
                  name: viewsLeft
                  schema:
                    type: string
                - description: 商品最高浏览量，单位为1000，示例：6 表示最高浏览量为6000人次
                  in: query
                  name: viewsRight
                  schema:
                    type: string
                - description: 单品最高价格
                  in: query
                  name: planPriceRight
                  schema:
                    type: string
                - description: 商品最高佣金比例
                  in: query
                  name: revshareRight
                  schema:
                    type: string
                - description: 最大经营年限，配合最小经营年限进行区间查询。单位为月。示例：30 - 表示30个月，也就是2年半
                  in: query
                  name: supplierAccountAgeRight
                  schema:
                    type: string
                - description: 最低销量
                  in: query
                  name: saleVolumeLeft
                  schema:
                    type: string
                - description: 最大销量
                  in: query
                  name: saleVolumeRight
                  schema:
                    type: string
                - description: 带货达人数量（最低）
                  in: query
                  name: influencersLeft
                  schema:
                    type: string
                - description: 带货达人数量（最高）
                  in: query
                  name: influencersRight
                  schema:
                    type: string
                - description: 每页返回的服务数量
                  in: query
                  name: size
                  required: true
                  schema:
                    default: "10"
                    type: string
                - description: 当前分页页码
                  in: query
                  name: current
                  required: true
                  schema:
                    default: "1"
                    type: string
                - description: 排序，枚举值。1-单品价格；2-佣金比例；3-单品销量；4-销售额；5-浏览量；6-带货达人数量；
                  in: query
                  name: sort
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        description: 状态码：200表示查询成功
